<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b6d3d"/>
      <stop offset="100%" style="stop-color:#4d5e38"/>
    </linearGradient>
  </defs>
  
  <!-- Circle background -->
  <circle cx="100" cy="100" r="90" fill="#f9f6f0" stroke="url(#logo-gradient)" stroke-width="4"/>
  
  <!-- Wheat stalk and ears -->
  <g stroke="url(#logo-gradient)" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- Main stalk -->
    <path d="M100,160 L100,60"/>
    
    <!-- Left wheat ears -->
    <path d="M100,80 L70,65"/>
    <path d="M70,65 L60,70"/>
    
    <path d="M100,90 L75,75"/>
    <path d="M75,75 L65,80"/>
    
    <path d="M100,100 L80,85"/>
    <path d="M80,85 L70,90"/>
    
    <path d="M100,110 L85,95"/>
    <path d="M85,95 L75,100"/>
    
    <!-- Right wheat ears -->
    <path d="M100,80 L130,65"/>
    <path d="M130,65 L140,70"/>
    
    <path d="M100,90 L125,75"/>
    <path d="M125,75 L135,80"/>
    
    <path d="M100,100 L120,85"/>
    <path d="M120,85 L130,90"/>
    
    <path d="M100,110 L115,95"/>
    <path d="M115,95 L125,100"/>
  </g>
  
  <!-- Letter "B" stylized -->
  <path d="M85,155 Q75,155 75,145 L75,125 Q75,115 85,115 Q90,115 95,120 Q100,115 105,115 Q115,115 115,125 L115,145 Q115,155 105,155 Z" 
        fill="url(#logo-gradient)"/>
  
  <!-- Scale balance symbol representing trade/artiya -->
  <g stroke="url(#logo-gradient)" stroke-width="2.5" fill="none">
    <line x1="160" y1="140" x2="160" y2="160"/>
    <line x1="140" y1="160" x2="180" y2="160"/>
    <path d="M142,150 Q160,140 178,150"/>
    <circle cx="145" cy="150" r="5" fill="#f9f6f0"/>
    <circle cx="175" cy="150" r="5" fill="#f9f6f0"/>
  </g>
  
  <!-- Established year -->
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#4d5e38">EST. 2005</text>
</svg>
