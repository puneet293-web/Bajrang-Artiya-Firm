<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <pattern id="wheat" patternUnits="userSpaceOnUse" width="100" height="100">
      <g stroke="#8b6d3d" stroke-width="1.5" fill="none">
        <!-- Main wheat stalk -->
        <path d="M50,100 L50,40" opacity="0.7"/>
        
        <!-- Left side wheat ears -->
        <path d="M50,60 L40,50" opacity="0.6"/>
        <path d="M40,50 L35,52" opacity="0.6"/>
        
        <path d="M50,55 L35,45" opacity="0.6"/>
        <path d="M35,45 L30,47" opacity="0.6"/>
        
        <path d="M50,50 L30,40" opacity="0.6"/>
        <path d="M30,40 L25,42" opacity="0.6"/>
        
        <path d="M50,45 L25,35" opacity="0.6"/>
        <path d="M25,35 L20,37" opacity="0.6"/>
        
        <!-- Right side wheat ears -->
        <path d="M50,60 L60,50" opacity="0.6"/>
        <path d="M60,50 L65,52" opacity="0.6"/>
        
        <path d="M50,55 L65,45" opacity="0.6"/>
        <path d="M65,45 L70,47" opacity="0.6"/>
        
        <path d="M50,50 L70,40" opacity="0.6"/>
        <path d="M70,40 L75,42" opacity="0.6"/>
        
        <path d="M50,45 L75,35" opacity="0.6"/>
        <path d="M75,35 L80,37" opacity="0.6"/>
      </g>
    </pattern>
  </defs>
  
  <rect width="100" height="100" fill="url(#wheat)" opacity="0.2"/>
</svg>
